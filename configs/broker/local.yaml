keychain_service: misalignment-mechanisms.openrouter
keychain_account: ${oc.env:USER}
# Short path: macOS caps Unix socket paths at 104 bytes.
socket: ${oc.env:TMPDIR,/tmp}/mm-broker/control.sock
output_root: outputs/runs
base_url: https://openrouter.ai/api/v1
models:
  - deepseek/deepseek-v4-flash
  - z-ai/glm-5.3-flash
  - moonshotai/kimi-k3
max_trial_cost_usd: 10
trial_lifetime_sec: 14400
request_timeout_sec: 3600
