[project]
name = "misalignment-mechanisms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "hydra-core==1.3.2",
  "httpx>=0.28,<1",
  "sympy>=1.13,<2",
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
